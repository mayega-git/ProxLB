name: Publish APT repository to GitHub Pages

on:
  push:
    branches: [claude/feat-disk-ignore-filter]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME:  ${{ github.event.repository.name }}

    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Build dependencies ──────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            devscripts build-essential debhelper dh-python \
            python3-all reprepro gnupg curl ca-certificates

      # ── 3. Build .deb ──────────────────────────────────────────────────
      - name: Build .deb package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p /tmp/dist
          mv ../*.deb /tmp/dist/
          echo "DEB_FILE=$(ls /tmp/dist/*.deb | xargs basename)" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_ENV"

      # ── 4. Import GPG key ──────────────────────────────────────────────
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID:      ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # `gpg --import-ownertrust` needs the full 40-char fingerprint.
          # Read it straight from the imported secret key to avoid relying
          # on GPG_KEY_ID (gpg rejects bare long key IDs as user IDs).
          GPG_FPR=$(gpg --batch --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$GPG_FPR" ]; then
            echo "Could not resolve GPG fingerprint from imported secret keys" >&2
            exit 1
          fi
          echo "${GPG_FPR}:6:" | gpg --import-ownertrust
          echo "GPG_FPR=$GPG_FPR" >> "$GITHUB_ENV"

      # ── 5. Configure git identity ──────────────────────────────────────
      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      # ── 6. Checkout or create gh-pages worktree ────────────────────────
      - name: Prepare gh-pages worktree
        run: |
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add /tmp/gh-pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
            touch /tmp/gh-pages/.nojekyll
          fi

      # ── 7. Setup reprepro configuration ───────────────────────────────
      - name: Configure reprepro
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          mkdir -p /tmp/gh-pages/conf
          cat > /tmp/gh-pages/conf/distributions <<EOF
          Origin: ProxLB Custom Repo
          Label: proxlb-custom
          Codename: stable
          Suite: stable
          Architectures: amd64
          Components: main
          Description: ProxLB with disk-size based ignore filter
          SignWith: ${GPG_KEY_ID}
          EOF

          cat > /tmp/gh-pages/conf/options <<EOF
          verbose
          basedir .
          EOF

      # ── 8. Import .deb into the APT repo ──────────────────────────────
      - name: Add .deb to APT repository
        run: |
          cd /tmp/gh-pages
          reprepro includedeb stable /tmp/dist/*.deb

      # ── 9. Export public GPG key ───────────────────────────────────────
      - name: Export public key
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          gpg --armor --export "$GPG_KEY_ID" > /tmp/gh-pages/public.key

      # ── 10. Generate index.html ────────────────────────────────────────
      - name: Generate index page
        run: |
          BASE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          cat > /tmp/gh-pages/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ProxLB APT Repository</title>
            <style>
              body { font-family: ui-monospace, monospace; max-width: 860px;
                     margin: 2rem auto; padding: 0 1.2rem; color: #1a1a1a; }
              h1   { border-bottom: 2px solid #e1e4e8; padding-bottom: .4rem; }
              pre  { background: #161b22; color: #e6edf3; padding: 1.2rem;
                     border-radius: 6px; overflow-x: auto; line-height: 1.5; }
              .badge { display: inline-block; background: #238636; color: #fff;
                       border-radius: 4px; padding: .1rem .5rem; font-size: .85rem; }
            </style>
          </head>
          <body>
            <h1>ProxLB ─ Custom APT Repository</h1>
            <p>
              Custom build of <strong>ProxLB</strong> containing:
              disk-size based ignore filter &bull; per-guest opt-out tag
              (<code>plb_disk_ignore_skip</code>) &bull; <code>ignore_reason</code>
              traceability field.
            </p>
            <p>Latest version: <span class="badge">${{ env.PKG_VERSION }}</span></p>

            <h2>Quick install</h2>
            <pre># 1. Add GPG key
          curl -fsSL ${BASE_URL}/public.key \\
            | sudo gpg --dearmor -o /etc/apt/keyrings/proxlb-custom.gpg

          # 2. Add repository
          echo "deb [signed-by=/etc/apt/keyrings/proxlb-custom.gpg] \\
          ${BASE_URL} stable main" \\
            | sudo tee /etc/apt/sources.list.d/proxlb-custom.list

          # 3. Install
          sudo apt-get update
          sudo apt-get install -y proxlb

          # 4. Configure
          sudo cp /etc/proxlb/proxlb_example.yaml /etc/proxlb/proxlb.yaml
          sudo vi /etc/proxlb/proxlb.yaml

          # 5. Start
          sudo systemctl enable --now proxlb
          journalctl -u proxlb -f</pre>

            <h2>New option: disk-size based ignore filter</h2>
            <pre># /etc/proxlb/proxlb.yaml  (balancing section)
          balancing:
            disk_ignore_enable: True     # activate the filter
            disk_ignore_threshold: 500   # GB — guests above this are skipped
            disk_ignore_mode: assigned   # 'assigned' (maxdisk) | 'used' (disk)</pre>

            <p>
              Add tag <code>plb_disk_ignore_skip</code> on a guest to force-balance
              it even when the global filter would otherwise exclude it.
            </p>

            <h2>Source</h2>
            <p>
              Branch:
              <a href="https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/claude/feat-disk-ignore-filter">
                claude/feat-disk-ignore-filter
              </a>
            </p>
          </body>
          </html>
          HTML

      # ── 11. Remove conf dir (not served, only used by reprepro) ────────
      - name: Remove reprepro conf
        run: rm -rf /tmp/gh-pages/conf

      # ── 12. Commit and push gh-pages ───────────────────────────────────
      - name: Commit and push to gh-pages
        run: |
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish — already up to date."
          else
            git commit -m "apt: publish ${DEB_FILE}"
            git push origin gh-pages
          fi
